version: v1
kind: ServiceTemplate
metadata:
  name: typescript-chatbot
  description: TypeScript OpenAI chatbot created by meshagent create.
variables:
  - name: image
    title: Container image
    description: Image tag built and deployed by meshagent deploy.
    optional: true
  - name: domain
    title: Public domain
    description: Public route domain for the deployed web service.
    type: route
    optional: true
container:
  image: "{{ image }}"
  template: agent
  environment:
    - name: PORT
      value: "3000"
  private: false
ports:
  - num: 3000
    type: http
    published: true
    liveness: /health
