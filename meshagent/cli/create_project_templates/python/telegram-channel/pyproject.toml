[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshagent-create-python-telegram-channel"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "meshagent-api==__MESHAGENT_CLIENT_VERSION__",
  "meshagent-agents==__MESHAGENT_CLIENT_VERSION__",
  "meshagent-telegram==__MESHAGENT_TELEGRAM_VERSION__",
  "textual>=8.2.3,<9.0",
]

[tool.setuptools]
py-modules = ["server"]
