version: v1
kind: ServiceTemplate
metadata:
  name: python-contact-form
  description: Python contact form created by meshagent create.
variables:
  - name: image
    title: Container image
    description: Image tag built and deployed by meshagent deploy.
    optional: true
  - name: domain
    title: Public domain
    description: Public route domain for the contact form.
    type: route
    optional: true
  - name: from_email
    title: From email
    description: Public mailbox used as the sender address for contact form messages.
    type: email
  - name: to_email
    title: Destination email
    description: External or public email address that receives contact form submissions.
  - name: delivery_email
    title: SMTP envelope recipient
    description: Optional external delivery alias when the destination is a private MeshAgent mailbox.
    optional: true
agents:
  - name: python-contact-form
    email:
      address: "{{ from_email }}"
      public: true
container:
  image: meshagent/python:default
  template: agent
  command: python -m server
  working_dir: /app
  environment:
    - name: CONTACT_FORM_FROM
      value: "{{ from_email }}"
    - name: CONTACT_FORM_TO
      value: "{{ to_email }}"
    - name: CONTACT_FORM_DELIVERY_TO
      value: "{{ delivery_email }}"
    - name: SMTP_USERNAME
      value: python-contact-form
    - name: MESHAGENT_TOKEN
      token:
        identity: python-contact-form
        role: agent
    - name: SMTP_PASSWORD
      token:
        identity: python-contact-form
        role: agent
  storage:
    images:
      - image: "{{ image }}"
        path: /app
        subpath: app
        read_only: true
  private: false
ports:
  - num: 8000
    type: http
    published: true
    public: true
    liveness: /health
