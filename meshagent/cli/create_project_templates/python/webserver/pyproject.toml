[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshagent-create-python-webserver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "aiofiles~=24.1",
  "aiohttp[speedups]~=3.13.0",
  # CVE-2026-111497: aiohttp speedups must use patched Brotli decoders.
  "brotli>=1.2.1; platform_python_implementation == 'CPython'",
  "brotlicffi>=1.2.1.0; platform_python_implementation != 'CPython'",
  "meshagent-api==__MESHAGENT_CLIENT_VERSION__",
  "meshagent-tools==__MESHAGENT_CLIENT_VERSION__",
  "openai~=2.25.0",
]

[tool.setuptools]
py-modules = ["server"]
