[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshagent-cli"
description = "CLI for Meshagent"
requires-python = ">=3.13"
license = "Apache-2.0"
keywords = []
dependencies = [
  "typer~=0.21",
  "aiofiles~=24.1",
  "fastmcp~=2.8",
  "opentelemetry-distro~=0.59b0",
  "opentelemetry-exporter-otlp-proto-http~=1.33",
  "art~=6.5",
  "pyyaml~=6.0.2",
  "pydantic-yaml~=1.5",
  "pyarrow~=21.0.0",
  "pathspec>=1.0.3,<2",
  "zstandard~=0.25.0",
  "meshagent-llm-proxy==0.39.4",
  "rich~=14.3.0",
  "textual>=8.2.3,<9.0",
  "prompt-toolkit~=3.0.52",
]

dynamic = ["version", "readme"]

[project.optional-dependencies]

all = [
  "meshagent-agents[all]==0.39.4",
  "meshagent-api[all]==0.39.4",
  "meshagent-commoncrawl==0.39.4",
  "meshagent-scrapy==0.39.4",
  "meshagent-computers==0.39.4",
  "meshagent-openai==0.39.4",
  "meshagent-anthropic==0.39.4",
  "meshagent-codex==0.39.4",
  "meshagent-otel==0.39.4",
  "meshagent-mcp==0.39.4",
  "meshagent-tools==0.39.4",
  "supabase-auth~=2.28.0",
  "prompt-toolkit~=3.0.52"
]

mcp-service = [
    "meshagent-agents[all]==0.39.4",
    "meshagent-api==0.39.4",
    "meshagent-mcp==0.39.4",
    "meshagent-tools==0.39.4",
    "supabase-auth~=2.28.0"
]

[project.scripts]            
meshagent = "meshagent.cli.cli:app"

[project.urls]
Documentation = "https://docs.meshagent.com"
Website = "https://www.meshagent.com"
Source = "https://www.meshagent.com"

[tool.setuptools.packages.find]
include = ["meshagent.*"]

[tool.setuptools.package-data]
"meshagent" = ["py.typed", "*.pyi", "**/*.pyi", "**/*.js"]

[tool.setuptools.dynamic]
version = {attr = "meshagent.cli.version.__version__"}
readme = { file = "README.md", content-type = "text/markdown" }
