[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshagent-cli"
description = "CLI for Meshagent"
requires-python = ">=3.13"
license = "Apache-2.0"
keywords = []
dependencies = [
  "typer~=0.26.6",
  "aiofiles~=24.1",
  "fastmcp~=2.8",
  "opentelemetry-distro~=0.59b0",
  "opentelemetry-exporter-otlp-proto-http~=1.33",
  "art~=6.5",
  "pyyaml~=6.0.2",
  "pydantic-yaml~=1.5",
  "pyarrow~=21.0.0",
  "openpyxl~=3.1",
  "xlsxwriter~=3.2",
  "pathspec>=1.0.3,<2",
  "zstandard~=0.25.0",
  "meshagent-llm-proxy==0.44.11",
  "meshagent-codex==0.44.11",
  "rich~=14.3.0",
  "sounddevice~=0.5",
  "textual>=8.2.3,<9.0",
  "textual-image[textual]~=0.12.0",
  "prompt-toolkit~=3.0.52",
  "ascii-magic~=2.3",
  "pillow~=11.3.0",
]

dynamic = ["version", "readme"]

[project.optional-dependencies]

all = [
  "meshagent-agents[all]==0.44.11",
  "meshagent-api[all]==0.44.11",
  "meshagent-commoncrawl==0.44.11",
  "meshagent-scrapy==0.44.11",
  "meshagent-computers==0.44.11",
  "meshagent-openai==0.44.11",
  "meshagent-anthropic==0.44.11",
  "meshagent-otel==0.44.11",
  "meshagent-mcp==0.44.11",
  "meshagent-tools==0.44.11",
  "supabase-auth~=2.28.0",
  "prompt-toolkit~=3.0.52"
]

mcp-service = [
    "meshagent-agents[all]==0.44.11",
    "meshagent-api==0.44.11",
    "meshagent-mcp==0.44.11",
    "meshagent-tools==0.44.11",
    "supabase-auth~=2.28.0"
]

[project.scripts]            
meshagent = "meshagent.cli.cli:app"

[project.urls]
Documentation = "https://docs.meshagent.com"
Website = "https://www.meshagent.com"
Source = "https://www.meshagent.com"

[tool.setuptools.packages.find]
include = ["meshagent.*"]

[tool.setuptools.package-data]
"meshagent" = [
  "py.typed",
  "*.pyi",
  "**/*.pyi",
  "**/*.js",
  "**/*.Dockerfile",
  "**/*.toml",
  "cli/create_project_templates/**/*",
  "cli/create_project_templates/**/.*",
]

[tool.setuptools.dynamic]
version = {attr = "meshagent.cli.version.__version__"}
readme = { file = "README.md", content-type = "text/markdown" }
